[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-retail-db"
version = "0.1.0"
description = "A custom educational DBMS implementing storage and indexing milestones"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
smartdb = "smartdb.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
