[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csai302-db"
version = "0.1.0"
description = "Custom disk-oriented relational and object DBMS for CSAI 302 (Milestones 1 & 2)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
